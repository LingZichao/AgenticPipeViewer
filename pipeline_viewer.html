<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AgentPipeViewer - Pipeline Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
        }

        .file-info {
            font-size: 14px;
            color: #bdc3c7;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: white;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background-color: white;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .trace-info {
            margin-top: 20px;
        }

        .trace-item {
            padding: 8px;
            margin-bottom: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            background-color: #f9f9f9;
        }

        .trace-item:hover {
            background-color: #e9e9e9;
        }

        .trace-item.selected {
            background-color: #3498db;
            color: white;
        }

        .event-details {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 5px;
        }

        .event-details h4 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .signal-list {
            font-family: monospace;
            font-size: 12px;
        }

        .signal-item {
            margin-bottom: 3px;
        }

        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AgentPipeViewer - Pipeline Visualizer</h1>
            <div class="file-info" id="file-info">No file loaded</div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="control-group">
                    <label for="file-input">Load JSON File:</label>
                    <input type="file" id="file-input" accept=".json">
                </div>

                <div class="control-group">
                    <label for="zoom-level">Zoom Level:</label>
                    <input type="range" id="zoom-level" min="-2" max="10" value="0" step="0.1">
                    <span id="zoom-value">1.0x</span>
                </div>

                <div class="control-group">
                    <label for="stage-filter">Filter by Stage:</label>
                    <select id="stage-filter">
                        <option value="">All Stages</option>
                    </select>
                </div>

                <div class="trace-info">
                    <h3>Traces</h3>
                    <div id="trace-list"></div>
                </div>

                <div class="event-details" id="event-details" style="display: none;">
                    <h4>Event Details</h4>
                    <div id="event-content"></div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="pipeline-canvas"></canvas>

                <div class="controls">
                    <div class="control-group">
                        <button id="reset-view">Reset View</button>
                    </div>
                    <div class="control-group">
                        <button id="fit-to-screen">Fit to Screen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading" style="display: none;">
        Loading pipeline data...
    </div>

    <div class="tooltip" id="tooltip" style="display: none;"></div>

    <script src="pipeline_viewer.js?v=20260407_3"></script>
</body>
</html>
